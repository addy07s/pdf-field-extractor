# Invoice field definitions — add/remove entries to change extraction schema,
# prompt, validators, and output columns. No code changes required.
fields:
  - key: company_name
    display_label: Company Name
    description: the legal or trade name of the invoice supplier
    data_type: string
    validators:
      - grounding

  - key: invoice_number
    display_label: Invoice Number
    description: the unique invoice or bill number printed on the document
    data_type: string
    validators:
      - grounding

  - key: invoice_date
    display_label: Invoice Date
    description: the date the invoice was issued (DD/MM/YYYY or similar)
    data_type: date
    validators:
      - date
      - grounding

  - key: supplier_gstin
    display_label: Supplier GSTIN
    description: >-
      The supplier's 15-character GSTIN. The first two digits are the supplier's
      state code (e.g. 27=Maharashtra, 29=Karnataka, 24=Gujarat).
    data_type: string
    validators:
      - gstin
      - grounding

  - key: recipient_gstin
    display_label: Recipient GSTIN
    description: >-
      The recipient/buyer's 15-character GSTIN when printed on the invoice.
      The first two digits are the recipient's state code. Return null only if
      no recipient GSTIN appears on the document.
    data_type: string
    validators:
      - gstin
      - grounding

  - key: pan
    display_label: PAN
    description: the supplier's 10-character Permanent Account Number
    data_type: string
    validators:
      - pan
      - grounding

  - key: description
    display_label: Description
    description: brief description of goods or services billed
    data_type: string
    validators:
      - grounding

  - key: total_taxable_value
    display_label: Total Taxable Value
    description: >-
      The invoice grand taxable value / base amount BEFORE any GST tax is added
      (sub-total before tax). Do NOT extract per-line taxable amounts — only the
      invoice-level total taxable value.
    data_type: number
    validators:
      - grounding
      - number

  - key: cgst_amount
    display_label: CGST Amount
    description: >-
      The TOTAL CGST tax amount for the entire invoice (grand total only — not
      per line item, and not the tax rate %). If CGST is not shown on the invoice,
      return 0.0 (never null). Do NOT combine with SGST or IGST.
    data_type: number
    validators:
      - number

  - key: sgst_amount
    display_label: SGST Amount
    description: >-
      The TOTAL SGST tax amount for the entire invoice (grand total only — not
      per line item, and not the tax rate %). If SGST is not shown on the invoice,
      return 0.0 (never null). Do NOT combine with CGST or IGST.
    data_type: number
    validators:
      - number

  - key: igst_amount
    display_label: IGST Amount
    description: >-
      The TOTAL IGST tax amount for the entire invoice (grand total only — not
      per line item, and not the tax rate %). If IGST is not shown on the invoice,
      return 0.0 (never null). Intra-state invoices use CGST+SGST (IGST must be 0.0);
      inter-state invoices use IGST (CGST and SGST must be 0.0).
    data_type: number
    validators:
      - number

  - key: total_invoice_value
    display_label: Total Invoice Value
    description: >-
      Invoice grand total payable in INR including all taxes. Must equal
      total_taxable_value + cgst_amount + sgst_amount + igst_amount.
    data_type: number
    validators:
      - number
      - grounding
